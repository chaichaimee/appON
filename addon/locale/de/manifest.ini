summary = "appOn"
description = """appOn ist eine schnelle und barrierefreie NVDA-Erweiterung, mit der Sie installierte Apps und Systemtools sofort starten können. Zu den Funktionen gehören automatische Erkennung, Versionsverfolgung, Kategorisierung, benutzerdefinierte Sortierung, ein Einstellungsmenü und Live-Aktualisierung.
Tastenkombination:
ALT+Windows+A : appOn-Menü-Center öffnen"""