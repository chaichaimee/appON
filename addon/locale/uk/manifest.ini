summary = "appOn"
description = """appOn — це швидке та доступне доповнення для NVDA, яке дозволяє миттєво запускати встановлені додатки та системні інструменти. Функції включають автовизначення, відстеження версій, категоризацію, власне сортування, меню налаштувань та оновлення в реальному часі.
Гаряча клавіша:
ALT+Windows+A : відкрити центр меню appOn"""