summary = "appOn"
description = """appOn एक तेज़ और सुलभ NVDA एड-ऑन है जो आपको इंस्टॉल किए गए ऐप्स और सिस्टम टूल को तुरंत लॉन्च करने देता है। विशेषताओं में ऑटो डिटेक्शन, वर्ज़न ट्रैकिंग, कैटेगराइजेशन, कस्टम सॉर्टिंग, एक सेटिंग मेनू और लाइव रिफ्रेशिंग शामिल हैं।
शॉर्टकट कुंजी:
ALT+Windows+A : appOn मेनू सेंटर खोलें"""